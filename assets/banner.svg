<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ttl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Maryam Sohail Ahmed - Machine Learning, Karachi, Pakistan</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12293f"/>
      <stop offset="1" stop-color="#1B3A5C"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E8A33D" opacity="0.14"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="1010" y="30" width="150" height="120" rx="6"/></clipPath>
  </defs>

  <style>
    .t { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .roc { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 7s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; } 50%, 100% { stroke-dashoffset: 0; } }
    .steam { opacity: 0; animation: rise 3.2s ease-in-out infinite; }
    .s2 { animation-delay: .8s; }
    .s3 { animation-delay: 1.6s; }
    @keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .55; } 100% { transform: translateY(-14px); opacity: 0; } }
    .cur { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .tw { animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
  </style>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <ellipse cx="840" cy="175" rx="330" ry="170" fill="url(#glow)"/>

  <!-- twinkles -->
  <circle class="tw" cx="130" cy="36" r="2" fill="#E8A33D"/>
  <circle class="tw" cx="330" cy="26" r="2" fill="#FAFAF8" style="animation-delay:1s"/>
  <circle class="tw" cx="540" cy="48" r="2" fill="#E8A33D" style="animation-delay:2s"/>
  <circle class="tw" cx="640" cy="28" r="1.6" fill="#FAFAF8" style="animation-delay:.5s"/>
  <circle class="tw" cx="1180" cy="190" r="1.8" fill="#E8A33D" style="animation-delay:1.5s"/>

  <!-- left: text -->
  <text class="t" x="60" y="132" font-size="46" font-weight="700" fill="#E8A33D" textLength="540" lengthAdjust="spacingAndGlyphs">Maryam Sohail Ahmed</text>
  <text class="t" x="60" y="172" font-size="21" fill="#FAFAF8">Machine Learning · Karachi, Pakistan</text>
  <text class="t" x="60" y="210" font-size="17" fill="#9FB6CE">&gt; I report the metrics that hurt, too<tspan class="cur" fill="#E8A33D">_</tspan></text>

  <!-- evidence chips (the signature) -->
  <g class="t" font-size="12" font-weight="700" letter-spacing="1">
    <rect x="60" y="234" width="100" height="26" rx="4" fill="#0d2033" stroke="#5B7FA6"/>
    <text x="110" y="251" text-anchor="middle" fill="#FAFAF8">OBSERVED</text>
    <rect x="172" y="234" width="128" height="26" rx="4" fill="#E8A33D"/>
    <text x="236" y="251" text-anchor="middle" fill="#1B3A5C">DIRECTIONAL</text>
    <rect x="312" y="234" width="128" height="26" rx="4" fill="#9AA0A6"/>
    <text x="376" y="251" text-anchor="middle" fill="#12293f">NOT CLAIMED</text>
  </g>

  <!-- right: desk scene -->
  <!-- window: Karachi at night -->
  <g clip-path="url(#win)">
    <rect x="1010" y="30" width="150" height="120" fill="#0a1a2a"/>
    <circle cx="1130" cy="62" r="12" fill="#F2E6D0"/>
    <circle cx="1136" cy="58" r="11" fill="#0a1a2a"/>
    <rect x="1020" y="110" width="22" height="40" fill="#12293f"/>
    <rect x="1046" y="92" width="18" height="58" fill="#163049"/>
    <path d="M1070 150 v-28 a18 18 0 0 1 36 0 v28 z" fill="#12293f"/>
    <rect x="1086" y="98" width="3" height="8" fill="#12293f"/>
    <rect x="1112" y="100" width="5" height="50" fill="#163049"/>
    <circle cx="1114.5" cy="97" r="3.5" fill="#163049"/>
    <rect x="1122" y="116" width="26" height="34" fill="#12293f"/>
    <rect x="1026" y="118" width="4" height="5" fill="#E8A33D" opacity=".85"/>
    <rect x="1034" y="128" width="4" height="5" fill="#E8A33D" opacity=".6"/>
    <rect x="1052" y="102" width="4" height="5" fill="#E8A33D" opacity=".8"/>
    <rect x="1052" y="118" width="4" height="5" fill="#E8A33D" opacity=".5"/>
    <rect x="1130" y="124" width="4" height="5" fill="#E8A33D" opacity=".85"/>
    <rect x="1138" y="136" width="4" height="5" fill="#E8A33D" opacity=".6"/>
  </g>
  <rect x="1010" y="30" width="150" height="120" rx="6" fill="none" stroke="#E8A33D" stroke-width="3"/>
  <rect x="1004" y="148" width="162" height="6" rx="3" fill="#E8A33D"/>

  <!-- desk -->
  <rect x="600" y="270" width="600" height="50" fill="#0d2033"/>
  <line x1="600" y1="270" x2="1200" y2="270" stroke="#E8A33D" stroke-width="2" opacity=".6"/>

  <!-- plant -->
  <ellipse cx="627" cy="236" rx="6" ry="15" fill="#4E8C7A"/>
  <ellipse cx="616" cy="242" rx="5" ry="11" fill="#5FA08C" transform="rotate(-30 616 242)"/>
  <ellipse cx="639" cy="242" rx="5" ry="11" fill="#5FA08C" transform="rotate(30 639 242)"/>
  <rect x="614" y="252" width="26" height="18" rx="3" fill="#E8A33D"/>

  <!-- monitor -->
  <rect x="825" y="255" width="30" height="12" fill="#0d2033"/>
  <rect x="800" y="265" width="80" height="6" rx="3" fill="#23445f"/>
  <rect x="680" y="80" width="320" height="175" rx="10" fill="#0d2033" stroke="#E8A33D" stroke-width="3"/>
  <rect x="692" y="92" width="296" height="151" rx="4" fill="#0a1a2a"/>

  <!-- screen: ROC chart from the real chest X-ray result -->
  <circle cx="704" cy="101" r="2.5" fill="#E8A33D"/>
  <circle cx="713" cy="101" r="2.5" fill="#9AA0A6"/>
  <circle cx="722" cy="101" r="2.5" fill="#9AA0A6"/>
  <text class="t" x="738" y="104" font-size="10" fill="#9FB6CE">ROC · RSNA real data</text>
  <g stroke="#5B7FA6" stroke-width="1" opacity=".35">
    <line x1="714" y1="175" x2="962" y2="175"/>
    <line x1="714" y1="126" x2="962" y2="126"/>
    <line x1="776" y1="126" x2="776" y2="224"/>
    <line x1="838" y1="126" x2="838" y2="224"/>
    <line x1="900" y1="126" x2="900" y2="224"/>
  </g>
  <line x1="714" y1="126" x2="714" y2="224" stroke="#5B7FA6" stroke-width="1.5"/>
  <line x1="714" y1="224" x2="962" y2="224" stroke="#5B7FA6" stroke-width="1.5"/>
  <line x1="714" y1="224" x2="962" y2="126" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M714 224 C 726 168, 768 140, 830 133 S 940 127, 962 126 L 962 224 Z" fill="#E8A33D" opacity=".12"/>
  <path class="roc" pathLength="1" d="M714 224 C 726 168, 768 140, 830 133 S 940 127, 962 126" fill="none" stroke="#E8A33D" stroke-width="3" stroke-linecap="round"/>
  <text class="t" x="905" y="203" font-size="18" font-weight="700" fill="#E8A33D" text-anchor="middle">AUC 0.838</text>
  <text class="t" x="905" y="216" font-size="9" fill="#9FB6CE" text-anchor="middle">MobileNetV2</text>
  <text class="t" x="714" y="238" font-size="9" fill="#9AA0A6">NOT CLAIMED: clinical use</text>

  <!-- keyboard -->
  <rect x="895" y="262" width="112" height="8" rx="3" fill="#23445f"/>

  <!-- chai -->
  <path d="M1032 238 L1068 238 L1064 268 Q1050 274 1036 268 Z" fill="#F2E6D0"/>
  <ellipse cx="1050" cy="238" rx="18" ry="5" fill="#B5773E"/>
  <path d="M1068 244 q14 4 -3 20" fill="none" stroke="#F2E6D0" stroke-width="4" stroke-linecap="round"/>
  <path class="steam" d="M1044 230 q-5 -8 0 -14 q5 -6 0 -12" fill="none" stroke="#FAFAF8" stroke-width="2" stroke-linecap="round"/>
  <path class="steam s2" d="M1051 230 q-5 -8 0 -14 q5 -6 0 -12" fill="none" stroke="#FAFAF8" stroke-width="2" stroke-linecap="round"/>
  <path class="steam s3" d="M1058 230 q-5 -8 0 -14 q5 -6 0 -12" fill="none" stroke="#FAFAF8" stroke-width="2" stroke-linecap="round"/>
</svg>
